<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>
    <div class="site-shell">
      <aside class="site-nav" aria-label="주요 메뉴">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="홈으로 이동">
          <span class="brand-mark">JL</span>
          <span class="brand-name">JONGHO<br>LEE</span>
        </a>
        <nav class="nav-links">
          <a href="{{ '/' | relative_url }}#work">Work</a>
          <a href="{{ '/' | relative_url }}#experience">Experience</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#about">About</a>
        </nav>
        <div class="nav-bottom">
          <button class="theme-toggle" type="button" aria-label="색상 모드 전환" data-theme-toggle>
            <span class="theme-icon">◐</span><span data-theme-label>Dark mode</span>
          </button>
          <div class="nav-socials">
            <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noreferrer">GH</a>
            <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noreferrer">IN</a>
            <a href="mailto:{{ site.email }}">@</a>
          </div>
          <p class="nav-caption">AI / DATA / SYSTEMS<br>Busan · Korea</p>
        </div>
      </aside>
      <main id="content" class="site-main">
        {{ content }}
      </main>
    </div>
    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} JONGHO LEE</span>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </footer>
    <script src="{{ '/assets/js/index.js' | relative_url }}"></script>
  </body>
</html>

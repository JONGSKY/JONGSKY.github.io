<aside class="rail" id="contents-rail">
  <div class="rail-header">
    <div class="rail-label">Contents</div>
    <button class="rail-toggle rail-open" type="button" title="목차 접기" aria-label="목차 접기" aria-expanded="true">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M6.2 2.5v11" stroke="currentColor" stroke-width="1.4"/>
        <path d="m4.6 6.1-1.7 1.9 1.7 1.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="rail-toggle-label">접기</span>
    </button>
  </div>

  <nav class="rail-toc" id="rail-toc" aria-label="목차" hidden></nav>

  <div class="rail-progress" id="rail-progress" hidden>
    <div class="rail-progress-row">
      <div class="rail-progress-track" aria-hidden="true"><span id="rail-progress-fill"></span></div>
      <span class="rail-progress-value" id="rail-progress-value">00%</span>
    </div>
    <p class="rail-progress-hint" aria-hidden="true">PRESS <span>↑</span> / <span>↓</span> TO SCROLL</p>
  </div>

  <nav class="rail-nav" id="rail-nav" aria-label="카테고리">
    <div class="rail-part">Categories</div>
    <ul>
      {%- for c in site.data.categories -%}
      <li>
        <a href="{{ c.url | relative_url }}"{% if page.url contains c.url %} class="act"{% endif %}>
          <span class="n">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>{{ c.title }}
        </a>
      </li>
      {%- endfor -%}
    </ul>
  </nav>
</aside>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/jongho-favicon.svg' | relative_url }}">
<link rel="icon" type="image/x-icon" href="{{ '/assets/images/jongho-favicon.svg' | relative_url }}">
<script>
  (function () {
    try {
      var t = localStorage.getItem("jongho-portfolio-theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {}
    try {
      if (localStorage.getItem("jongho-rail-collapsed") === "true" && window.innerWidth > 1024) {
        document.documentElement.classList.add("rail-collapsed");
      }
    } catch (e) {}
  })();
</script>
